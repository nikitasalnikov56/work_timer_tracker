include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # Запрещает неявные приведения из dynamic — особенно важно при разборе JSON.
    strict-casts: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
